name: Release

# Publishes to PyPI via trusted publishing (OIDC): no API token is stored
# anywhere in this repository. PyPI verifies the workflow identity instead.
on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-extras

      # A version number can never be reused on PyPI. Everything that gates
      # main gates a release too — a broken upload is not revocable.
      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Type check (mypy)
        run: uv run mypy src/

      - name: Tests
        run: uv run pytest -q

      - name: Build sdist + wheel
        run: uv build

      # Guards against tagging v0.3.0 while pyproject still says 0.2.0, which
      # would publish a release whose number matches nothing in the tree.
      - name: Tag must match package version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          pkg=$(python3 -c "import tomllib,pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          if [ "$TAG" != "v$pkg" ]; then
            echo "::error::tag '$TAG' does not match package version '$pkg'"
            exit 1
          fi
          echo "tag '$TAG' matches package version '$pkg'"

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # mint the OIDC token PyPI checks; nothing else is granted
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
