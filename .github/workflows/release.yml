name: Release

# Validates a tagged release: gates, build, and tag/version agreement.
#
# It does NOT publish. The package is deliberately not on PyPI — installation
# goes through a clone (see README). Publishing would need an authenticated
# path, and none is configured on purpose.
#
# To publish later, add a `publish` job with `permissions: id-token: write` and
# `pypa/gh-action-pypi-publish`, and register a trusted publisher on PyPI for
# this repository and this workflow file. Nothing else here needs to change.
on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-extras

      # A version number can never be reused on PyPI. Everything that gates
      # main gates a release too — a broken upload is not revocable.
      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Type check (mypy)
        run: uv run mypy src/

      - name: Tests
        run: uv run pytest -q

      - name: Build sdist + wheel
        run: uv build

      # Guards against tagging v0.3.0 while pyproject still says 0.2.0, which
      # would publish a release whose number matches nothing in the tree.
      - name: Tag must match package version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          pkg=$(python3 -c "import tomllib,pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          if [ "$TAG" != "v$pkg" ]; then
            echo "::error::tag '$TAG' does not match package version '$pkg'"
            exit 1
          fi
          echo "tag '$TAG' matches package version '$pkg'"

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
