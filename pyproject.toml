[project]
name = "panelize-code"
version = "0.1.0"
description = "Config-driven terminal dashboard. Define panels in TOML, point them at shell commands, get a live TUI."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Felis", email = "felis.virama07@gmail.com" }]
keywords = ["tui", "dashboard", "textual", "cli", "terminal", "monitoring"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console :: Curses",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Monitoring",
    "Topic :: Terminals",
    "Topic :: Utilities",
]
dependencies = [
    "pydantic>=2.9",
    "rich>=13.7",
    "textual>=0.80",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "mypy>=1.11",
    "ruff>=0.6",
]

[project.scripts]
panelize = "panelize_code.cli:main"

[project.urls]
Homepage = "https://github.com/VFK00/panelize-code"
Repository = "https://github.com/VFK00/panelize-code"
Issues = "https://github.com/VFK00/panelize-code/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/panelize_code"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--cov=src/panelize_code --cov-report=term-missing --cov-fail-under=70"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
